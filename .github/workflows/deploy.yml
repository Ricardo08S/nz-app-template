name: Deploy to VPS

on:
  push:
    branches:
      # development omitted on purpose: secrets/development/ does not exist
      # yet, so a push there would only trigger a job that fails validation.
      - production
    paths:
      - apps/server/**
      - apps/web/**
      - deploy/**
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      confirm_migrations:
        description: "Apply pending migrations (deploy.sh aborts otherwise if any exist)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  APP_ENV: ${{ github.ref_name }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    name: Deploy to VPS
    runs-on: self-hosted
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # deploy.sh diffs migration files between this commit and the
          # previously-deployed one (state.json) to detect breaking
          # migrations (§4.7) — needs full history, not the default shallow
          # single-commit clone, or that diff would fail outright.
          fetch-depth: 0

      # Merged into one .env so dotenv-expand can resolve $POSTGRES_PASSWORD/$APP_NAME/$BASE_DOMAIN across files.
      - name: Decrypt and merge secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          cat deploy/env/${{ env.APP_ENV }}.env \
            <(sops -d --output-type dotenv secrets/${{ env.APP_ENV }}/infra.sops.yaml) \
            <(sops -d --output-type dotenv secrets/${{ env.APP_ENV }}/server.sops.yaml) \
            > apps/server/.env
          cat deploy/env/${{ env.APP_ENV }}.env \
            <(sops -d --output-type dotenv secrets/${{ env.APP_ENV }}/web.sops.yaml) \
            > apps/web/.env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate apps/server/.env against the runtime schema
        run: pnpm exec tsx scripts/validate-env.ts apps/server/.env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Blue-green deploy
        env:
          CONFIRM_MIGRATIONS: ${{ github.event.inputs.confirm_migrations || 'false' }}
        run: |
          bash deploy/deploy.sh \
            "${{ env.APP_ENV }}" \
            "ghcr.io/${{ github.repository }}-server@${{ needs.build.outputs.server_digest }}" \
            "ghcr.io/${{ github.repository }}-web@${{ needs.build.outputs.web_digest }}" \
            "${{ github.sha }}"
