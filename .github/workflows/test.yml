name: Playwright Tests

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  test:
    name: Run Playwright Tests
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ephemeral, same services this template already uses for local dev
      # (Langkah 2) — not a shared VPS database, per §2.9.
      - name: Start Postgres + Garage
        run: docker compose -f docker-compose.services.yml up -d --wait

      - name: Bootstrap Garage bucket
        id: garage
        run: |
          set -euo pipefail
          bash scripts/garage-init.sh ci-test-bucket | tee /tmp/garage-init.log
          echo "access_key_id=$(grep 'Key ID:' /tmp/garage-init.log | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
          echo "secret_access_key=$(grep 'Secret key:' /tmp/garage-init.log | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      # Throwaway values for a throwaway run — the DB and bucket above die with
      # the job. No SOPS decrypt needed; only the Garage keys are real, because
      # Garage generated them itself in the step above.
      - name: Write env files
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.garage.outputs.access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.garage.outputs.secret_access_key }}
        run: |
          cat > apps/server/.env <<EOF
          APP_NAME=nz-app-template
          APP_ENV=test
          DATABASE_URL=postgresql://postgres:nz-app-template-password-default@localhost:5432/nz-app-template
          JWT_ACCESS_KEY=ci-test-access-key-not-a-real-secret-000
          JWT_REFRESH_KEY=ci-test-refresh-key-not-a-real-secret-00
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_S3_BUCKET=ci-test-bucket
          AWS_S3_ENDPOINT=http://127.0.0.1:3900
          PUBLIC_S3_ENDPOINT=http://ci-test-bucket.web.localhost:3902
          EOF
          cat > apps/web/.env <<EOF
          PUBLIC_ENVIRONMENT=test
          PUBLIC_BACKEND_URL=http://localhost:3000
          PUBLIC_S3_ENDPOINT=http://ci-test-bucket.web.localhost:3902
          PUBLIC_ENABLE_LOGGING=false
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate apps/server/.env against the runtime schema
        run: pnpm exec tsx scripts/validate-env.ts apps/server/.env

      - name: Generate ZenStack client
        run: pnpm generate
        working-directory: apps/server

      - name: Typecheck
        run: pnpm typecheck

      - name: Run server unit tests
        run: pnpm test
        working-directory: apps/server

      - name: Run web unit tests
        run: pnpm test:unit
        working-directory: apps/web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      # migrations/ does not exist yet (§4.7, first one lands in Langkah 7) —
      # this is a no-op until then, not a failure.
      - name: Run database migrations
        run: pnpm migrate:deploy
        working-directory: apps/server

      - name: Run Playwright tests
        run: pnpm test
        working-directory: apps/web
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
