name: Playwright Tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

env:
  APP_ENV: test

jobs:
  test:
    # temporarily disable
    if: false
    name: Run Playwright Tests
    runs-on: self-hosted
    timeout-minutes: 15
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load test port config
        run: echo "${{ secrets.ENV_FILE_TEST }}" | envsubst >> "$GITHUB_ENV"

      - name: Validate ENV_FILE_TEST
        run: |
          set -euo pipefail
          missing=0
          while IFS='=' read -r key _; do
            [ -z "$key" ] && continue
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "::error::missing/empty key in ENV_FILE_TEST: $key"
              missing=1
            fi
          done < env-templates/ENV_FILE_TEST.template
          exit $missing

      - name: Create .env files
        run: |
          echo "${{ secrets.ENV_FILE_SERVER }}" | envsubst > apps/server/.env
          echo "${{ secrets.ENV_FILE_WEB }}" | envsubst > apps/web/.env

      - name: Validate .env files
        run: |
          set -euo pipefail
          missing=0
          declare -A secret_names=( [server]=ENV_FILE_SERVER [web]=ENV_FILE_WEB )
          for app in server web; do
            template="env-templates/${secret_names[$app]}.template"
            envfile="apps/${app}/.env"
            while IFS='=' read -r key _; do
              [ -z "$key" ] && continue
              if ! grep -q "^${key}=" "$envfile"; then
                echo "::error::missing key in apps/${app}/.env: $key"
                missing=1
                continue
              fi
              value="$(grep "^${key}=" "$envfile" | cut -d= -f2-)"
              if [ "$value" = '""' ] || [ -z "$value" ]; then
                echo "::error::empty value in apps/${app}/.env: $key"
                missing=1
              fi
            done < "$template"
          done
          exit $missing

      - name: Validate web app points at test server port
        run: |
          set -euo pipefail
          expected="http://localhost:${SERVER_PORT}"
          actual="$(grep '^PUBLIC_BACKEND_URL=' apps/web/.env | cut -d= -f2- | tr -d '"')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::apps/web/.env PUBLIC_BACKEND_URL is '$actual', expected '$expected' (SERVER_PORT=${SERVER_PORT}). Update secrets.ENV_FILE_WEB or ENV_FILE_TEST."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run database migrations
        run: pnpm migrate:deploy
        working-directory: apps/server

      - name: Run Playwright tests
        run: pnpm test
        working-directory: apps/web
        env:
          CI: true
          SERVER_PORT: ${{ env.SERVER_PORT }}
          WEB_PORT: ${{ env.WEB_PORT }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
