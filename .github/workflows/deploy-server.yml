name: Deploy server

on:
  push:
    branches: [development, staging, production, test-app]
    paths:
      - "apps/server/**"
      - "deploy/vars/**"
      - "deploy/env/*.server.env.enc"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-server.yml"
      - ".github/workflows/_deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      app: server
