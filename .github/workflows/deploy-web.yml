name: Deploy web

on:
  push:
    branches: [development, staging, production, test-app]
    paths:
      - "apps/web/**"
      - "deploy/vars/**"
      - "deploy/env/*.web.env.enc"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/_deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      app: web
