# Blue-green deploy of apps/web, same shape as deploy-server.yml. Simpler:
# no migrations, no secrets — apps/web's Dockerfile injects PUBLIC_* env vars
# at container start (docker-entrypoint.sh), so nothing here needs SOPS.

name: Deploy web (blue-green)

on:
  push:
    branches: [production, staging]
    paths:
      - apps/web/**
      - deploy/env/*.env
      - .github/workflows/deploy-web.yml
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_ENV: ${{ github.ref_name }}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load app env
        run: |
          set -a; source "deploy/env/${APP_ENV}.env"; set +a
          {
            echo "APP_NAME=$APP_NAME"
            echo "BASE_DOMAIN=$BASE_DOMAIN"
            echo "CADDYFILE=$CADDYFILE"
            echo "CADDY_APPS_DIR=$CADDY_APPS_DIR"
            echo "CADDY_BIN=$CADDY_BIN"
            echo "STATE_DIR=${STATE_DIR}"
            echo "BLUE_PORT=$WEB_BLUE_PORT"
            echo "GREEN_PORT=$WEB_GREEN_PORT"
            echo "IMAGE=${APP_NAME}-web"
            echo "PUBLIC_DOMAIN=${APP_NAME}-${APP_ENV}.${BASE_DOMAIN}"
            echo "PUBLIC_BACKEND_URL=https://${APP_NAME}-${APP_ENV}-server.${BASE_DOMAIN}"
            echo "PUBLIC_S3_ENDPOINT=https://${CENTRAL_S3_DOMAIN}/${APP_NAME}-${APP_ENV}"
          } >> "$GITHUB_ENV"

      - name: Resolve blue/green slots
        id: slots
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR"
          STATE_FILE="$STATE_DIR/active_slot_web"
          CURRENT=$(cat "$STATE_FILE" 2>/dev/null || echo "green")
          if [ "$CURRENT" = "blue" ]; then
            TARGET="green"; TARGET_PORT="$GREEN_PORT"; CURRENT_PORT="$BLUE_PORT"
          else
            TARGET="blue"; TARGET_PORT="$BLUE_PORT"; CURRENT_PORT="$GREEN_PORT"
          fi
          CADDY_SNIPPET="$STATE_DIR/web.caddy"
          {
            echo "current=$CURRENT"
            echo "target=$TARGET"
            echo "target_port=$TARGET_PORT"
            echo "current_port=$CURRENT_PORT"
            echo "caddy_snippet=$CADDY_SNIPPET"
          } >>"$GITHUB_OUTPUT"
          echo "Deploying to '$TARGET' slot (port $TARGET_PORT); current live slot is '$CURRENT'."

      - name: Ensure Caddy site block exists
        run: |
          set -euo pipefail
          CADDY_SNIPPET="${{ steps.slots.outputs.caddy_snippet }}"
          [ -f "$CADDY_SNIPPET" ] || printf 'reverse_proxy 127.0.0.1:%s\n' "${{ steps.slots.outputs.current_port }}" >"$CADDY_SNIPPET"
          # Never write to $CADDYFILE directly — it's the shared system Caddyfile,
          # other tenants' blocks live there too. We only own our file under
          # CADDY_APPS_DIR, which $CADDYFILE imports (set up once, outside this repo).
          mkdir -p "$CADDY_APPS_DIR"
          printf '%s {\n  import %s\n}\n' "$PUBLIC_DOMAIN" "$CADDY_SNIPPET" >"$CADDY_APPS_DIR/${PUBLIC_DOMAIN}.caddy"

      - name: Build image
        run: docker build -f apps/web/Dockerfile -t "$IMAGE:${{ github.sha }}" .

      - name: Start target slot container
        run: |
          set -euo pipefail
          TARGET="${{ steps.slots.outputs.target }}"
          TARGET_PORT="${{ steps.slots.outputs.target_port }}"
          docker rm -f "${IMAGE}-$TARGET" >/dev/null 2>&1 || true
          docker run -d \
            --name "${IMAGE}-$TARGET" \
            --restart unless-stopped \
            -e PUBLIC_BACKEND_URL="$PUBLIC_BACKEND_URL" \
            -e PUBLIC_S3_ENDPOINT="$PUBLIC_S3_ENDPOINT" \
            -e PUBLIC_ENVIRONMENT="$APP_ENV" \
            -e PUBLIC_ENABLE_LOGGING=true \
            -p "127.0.0.1:$TARGET_PORT:80" \
            "$IMAGE:${{ github.sha }}"

      - name: Health check target slot
        run: |
          set -euo pipefail
          TARGET_PORT="${{ steps.slots.outputs.target_port }}"
          TARGET="${{ steps.slots.outputs.target }}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$TARGET_PORT/health/live" >/dev/null 2>&1; then
              echo "Target slot '$TARGET' healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Target slot '$TARGET' failed health check; leaving old slot live."
          docker logs --tail 100 "${IMAGE}-$TARGET" || true
          docker rm -f "${IMAGE}-$TARGET" || true
          exit 1

      - name: Cut over Caddy to target slot
        run: |
          set -euo pipefail
          TARGET_PORT="${{ steps.slots.outputs.target_port }}"
          CADDY_SNIPPET="${{ steps.slots.outputs.caddy_snippet }}"
          printf 'reverse_proxy 127.0.0.1:%s\n' "$TARGET_PORT" >"$CADDY_SNIPPET"
          "$CADDY_BIN" validate --config "$CADDYFILE"
          "$CADDY_BIN" reload --config "$CADDYFILE"

      - name: Verify public endpoint after cutover
        run: |
          set -euo pipefail
          PUBLIC_URL="https://${PUBLIC_DOMAIN}/health/live"
          for i in $(seq 1 15); do
            if curl -fsS "$PUBLIC_URL" >/dev/null 2>&1; then
              echo "Public endpoint healthy after cutover."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Public endpoint failed after cutover to ${{ steps.slots.outputs.target }}."
          exit 1

      - name: Persist active slot and stop old container
        if: success()
        run: |
          set -euo pipefail
          echo "${{ steps.slots.outputs.target }}" >"$STATE_DIR/active_slot_web"
          docker rm -f "${IMAGE}-${{ steps.slots.outputs.current }}" >/dev/null 2>&1 || true
          echo "Old slot '${{ steps.slots.outputs.current }}' stopped and removed. Live slot is now '${{ steps.slots.outputs.target }}'."

      - name: Prune old images
        if: success()
        run: docker image prune -f --filter "until=72h" || true
